# Лицо персоны (этап 6, схема D4-гибрид).
# Глобальные словари живут в src/lilith_core/face/emotions.py,
# здесь — только per-persona override.

# D5.4: тело ВНЕ репозитория (git не таскает десятки мегабайт).
# Абсолютный путь или относительно этой папки. Пусто → ищем ./model.vrm.
vrm_path: ""
# vrm_path: "C:/Users/User/LilithBodies/lilith.vrm"

fallback: fallback.jpg      # статичный аватар, пока нет тела
slot: 0                     # место в групповой сцене (E4)
position: [0.0, 0.0, 0.0]   # локальная позиция в группе

# Параметры «живости» — их забирает IdleController в Unity:
idle:
  blink_freq: 0.28          # доля секунды: ~раз в 3.5 с
  breath_amp: 0.5           # амплитуда дыхания 0..1
  look_speed: 4.0           # скорость доводки взгляда

# Персональные переопределения эмоций (VRM 1.0 Expressions):
# emotions:
#   joy: {happy: 1.0, relaxed: 0.3}
#   evil: {angry: 0.4, happy: 0.6}

# Персональные переопределения визем:
# visemes:
#   aa: {aa: 1.0}

# Размер окна Unity-клиента под эту персону (Q5, хотфикс 0.6.2).
# Дефолт архитектора — портрет 4:5: в OBS такой кадр не тянут и не режут.
window:
  width: 512
  height: 640
