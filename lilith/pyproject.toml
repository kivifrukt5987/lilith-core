[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lilith-core"
version = "0.1.0"
description = "LILITH-CORE — домашний Python-стек ИИ-компаньона (оркестратор, память, уши, горло, лицо, руки, мосты)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lilith & Kiryusha" }]
keywords = ["ai-companion", "fastapi", "websocket", "vtuber", "local-llm"]

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "loguru>=0.7.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "anyio>=4.4",
]
# Этап 2 — мозг (OpenAI-совместимый клиент)
brain = ["openai>=1.30"]
# Этап 3 — память
memory = ["aiosqlite>=0.20", "chromadb>=0.5"]
# Этап 4 — уши и горло
# silero — официальный пакет Silero Team (PyPI `silero`, НЕ `silero-tts`: это чужая
# обёртка 0.0.5). Тянет torch>=1.12, omegaconf>=2.1, numpy>=1.23. ВАЖНО: модели Silero
# распространяются под CC BY-NC 4.0 — для домашнего проекта нормально, для коммерции нет.
voice = ["faster-whisper>=1.0", "pynput>=1.7", "edge-tts>=6.1", "torch>=2.2", "soundfile>=0.12", "numpy>=1.26", "silero>=0.5"]
# Этап 5 — лицо
face = ["websockets>=12.0"]
# Этап 6 — руки
hands = ["psutil>=5.9", "playwright>=1.44", "obs-websocket-py>=5.3"]
# Этап 7 — мосты
bridges = ["discord.py>=2.3", "vkbottle>=4.4"]
# Этап 8 — стрим
stream = ["twitchio>=2.9"]

[project.scripts]
lilith-core = "lilith_core.run:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lilith_core = [
    "webui/*.html",
    "webui/*.css",
    "webui/*.js",
    "persona/*.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    # starlette>=0.47 предупреждает про httpx внутри своего TestClient. Это обвязка
    # starlette, а не наш код; httpx у нас — осознанная dev-зависимость (приёмка 0.6.2).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
