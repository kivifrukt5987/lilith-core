# СЛОВАРЬ УДАРЕНИЙ — общий (0.7.2-а, ADR-030)
#
# Формат: «слово: номер ударной гласной» (1 = первая гласная слова).
# Хранится НОМЕР, а не готовая строка: маркер (acute U+0301 / caps / plus)
# выбирается конфигом `voice.preprocess.stress_mode` — словарь не переписывается.
#
# Ключи — в нижнем регистре, только кириллица. Регистр в тексте сохраняется.
# Личный словарь персоны: personas/<id>/voice/stress.yaml — он ГЛАВНЕЕ общего
# (0.7.2-а; имя согласовано с Архитектором: stress.yaml замещает accents.yaml).
#
# Наполняют Архитектор и Курьер по полю (дефекты qwen3: «КирюхА» и родня).
# Я только применяю: спорные ударения не выдумываю.
#
# Проверка после правки (без сервера):
#   python -c "from lilith_core.voice.preprocess import StressDictionary as D; \
#              d=D(); d.load(__import__('pathlib').Path('config/stress_ru.yaml')); print(d.words)"

words:
  # --- полевые дефекты 17.11 ------------------------------------------------
  кирюха: 2            # Кирю́ха (не «КирюхА» и не «КИрюха»)
  кирюше: 2
  кирюшу: 2
  кирюшей: 2
  кирюхой: 2
  кирюша: 2
  кирюшенька: 2
  кирюш: 2

  # --- имена, которые точно услышит горло --------------------------------
  лилит: 2             # Лили́т
  лиля: 1              # Ли́ля
  лиле: 1
  лилю: 1
  лилей: 1
  лиль: 1
  лилька: 1            # Ли́лька
  мика: 1              # Ми́ка
  мику: 1
  мике: 1
  аска: 1              # А́ска
  аску: 1
  аске: 1
  оля: 1               # О́ля
  олю: 1
  оле: 1
